# Prueft Snapshot-Drift und Syntax bei jedem Push. Ohne Dependencies -
# das Repo bleibt eine statische Web-App ohne Build.
name: checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests (Syntax, JSON-Extraktion, API-Client, Migration)
        run: npm test
      - name: Preset-Snapshots aktuell?
        run: npm run check:presets
